services:
  runnerbox-ci:
    image: ediano/runnerbox-ci:latest
    container_name: runnerbox-ci
    ports:
      - "2141:2141"
    volumes:
      # É por aqui que o painel cria, lista e remove os containers dos runners.
      - /var/run/docker.sock:/var/run/docker.sock
      # Tokens cifrados em repouso. Sem este volume, editar um runner volta a exigir
      # que o token seja redigitado após um recreate do painel.
      - runnerbox-data:/var/lib/runnerbox
    environment:
      NODE_ENV: production
      # Heap do V8 abaixo do limite de memória do container: o Node coleta lixo antes
      # de bater no teto, em vez de ser morto por OOM.
      NODE_OPTIONS: --max-old-space-size=96
      # Chave AES-256 (32 bytes em base64 ou hex). Se omitida, o painel gera uma e a
      # guarda em /var/lib/runnerbox/key com permissão 0600.
      # RUNNERBOX_SECRET_KEY: ${RUNNERBOX_SECRET_KEY}
    restart: unless-stopped
    # O trabalho pesado (build e pull das imagens dos runners) roda no daemon, não aqui:
    # o painel fica perto de 100 MB e 0% de CPU. Os limites só o impedem de fugir disso.
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"
          pids: 256
    # Sem swap além do limite, como o painel faz com os runners.
    memswap_limit: 128M

volumes:
  runnerbox-data:
